name: Przywróć res

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "SHA commita sprzed usunięcia res (wystarczy pierwszych 7 znaków)"
        required: true
      path:
        description: "Ścieżka do folderu res"
        required: true
        default: "AiXE-browser-project/app/src/main/res"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium z całą historią
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przywróć res z wybranego commita
        env:
          SHA: ${{ github.event.inputs.commit }}
          RES_PATH: ${{ github.event.inputs.path }}
        run: |
          git checkout "$SHA" -- "$RES_PATH"
          git status --short
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Przywróć folder res z commita $SHA"
          git push
