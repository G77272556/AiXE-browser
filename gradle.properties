# Rozmiar sterty dla procesu Gradle (Compose + kapt potrafią być pamięciożerne przy kompilacji).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AndroidX jest wymagany (Compose i wszystkie biblioteki androidx.* w kodzie tego opierają się na nim).
android.useAndroidX=true

# Kotlin generuje osobne klasy dla każdego pliku *.kt zamiast jednej wspólnej "MainActivityKt" itp.
kotlin.code.style=official

# Przyspiesza budowanie równoległe modułów (mamy tylko jeden moduł "app", ale nic to nie kosztuje).
org.gradle.parallel=true

# Buforowanie wyników budowania między uruchomieniami (szybsze kolejne buildy w Actions, jeśli cache jest zachowywany).
org.gradle.caching=true
